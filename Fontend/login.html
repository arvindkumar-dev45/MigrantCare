<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

<div class="login-box">

    <h1>MigrantCare Login</h1>

    <input
type="email"
id="username"
placeholder="Email">

    <input type="password"
    id="password"
    placeholder="Password">

    <button onclick="login()">
        Login
    </button>

    <p id="message"></p>

    <p>Don't have an account?<a href="register.html">Create Account</a></p>

</div>

<script src="login.js"></script>

</body>

</html>

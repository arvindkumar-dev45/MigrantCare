<!DOCTYPE html>
<html>
<head>
    <title>MigrantCare</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

<div class="login-box">

    <h1>MigrantCare</h1>

    <!-- LOGIN FORM -->
    <div id="loginForm">

        <input type="email"
               id="username"
               placeholder="Email">

        <input type="password"
               id="password"
               placeholder="Password">

        <button onclick="login()">
            Login
        </button>

        <p id="message"></p>

        <p>
            Don't have an account?
            <a href="#" onclick="showRegister()">
                Create Account
            </a>
        </p>

    </div>

    <!-- REGISTER FORM -->
    <div id="registerForm" style="display:none;">

        <input type="text"
               id="regName"
               placeholder="Full Name">

        <input type="email"
               id="regEmail"
               placeholder="Email">

        <input type="password"
               id="regPassword"
               placeholder="Password">

        <button onclick="register()">
            Create Account
        </button>

        <p id="registerMessage"></p>

        <p>
            Already have an account?
            <a href="#" onclick="showLogin()">
                Login
            </a>
        </p>

    </div>

</div>

<script src="login.js"></script>

</body>
</html>

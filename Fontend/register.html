<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="login-box">

    <h1>Create Account</h1>

    <input
        type="text"
        id="name"
        placeholder="Full Name">

    <input
        type="email"
        id="email"
        placeholder="Email">

    <input
        type="password"
        id="password"
        placeholder="Password">

    <button onclick="register()">
        Register
    </button>

    <p id="message"></p>

</div>

<script src="register.js"></script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>MigrantCare</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="admin-panel">

    <img src="profile.jpg" alt="Admin">

    <div>
        <h3>Arvind Kumar</h3>
        <p>Administrator</p>
    </div>

</div>

    <h1>Migrant Worker Registration</h1>
    <div class="dashboard-cards">

    <div class="card">
        <h2 id="workerCount">0</h2>
        <p>Total Workers</p>
    </div>

    <div class="card">
        <h2 id="stateCount">0</h2>
        <p>States</p>
    </div>

    <div class="card">
        <h2 id="bloodCount">0</h2>
        <p>Blood Groups</p>
    </div>

</div>
   <button id="logoutBtn" onclick="logout()">Logout</button>

<form>
       Name : <input id="name" type="text" placeholder="Enter Name"><br><br>

      Age:  <input id="age" type="number" placeholder="Enter Age"><br><br>

       State: <input id="state" type="text" placeholder="Enter State"><br><br>

       Blood Group: <input type="text" id="bloodGroup" placeholder="Blood Group"><br><br>

        Disease:<input type="text" id="disease" placeholder="Disease"><br><br>

        Phone No:<input type="text" id="phone" placeholder="Phone Number"><br><br>
        
        Photo: <input type="file" id="photo"><br><br>
    
        <button type="submit">Register Worker</button>
    </form>

    <p id="message"></p>
   

    <h2>Workers List</h2>

    <input type="text" id="search" placeholder="Search Worker..."><br><br>
    
<table border="1">
    <thead>
        <tr>
            <th>Photo</th>
            <th>Name</th>
            <th>Age</th>
            <th>State</th>
            <th>Blood Group</th>
            <th>Disease</th>
            <th>Phone</th>
            <th>Action</th>
            <th>QR</th>
        </tr>
    </thead>

    <tbody id="workersTable"></tbody>
</table>
  
          <h2>QR Code</h2>
         <div id="qrcode"></div>

 
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
       <script src="script.js"></script>
</body>
</html>
